<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>无雨子 · 卡密验证中心</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
    background:#070a12;
    color:#fff;
}

body{
    min-height:100vh;
    overflow:hidden;
}

.bg{
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle at 20% 10%,
            rgba(88,101,242,.28),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(0,210,255,.16),
            transparent 34%
        ),
        linear-gradient(
            145deg,
            #070a12,
            #0d1220 55%,
            #080b15
        );
}

.wrap{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
}

.card{
    width:min(440px,100%);
    padding:30px 24px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:26px;
    background:rgba(17,22,38,.78);
    box-shadow:
        0 25px 80px rgba(0,0,0,.45);
    backdrop-filter:blur(18px);
    text-align:center;
}

.brand{
    font-size:13px;
    letter-spacing:3px;
    color:#9da9c7;
    margin-bottom:12px;
}

h1{
    margin:0;
    font-size:28px;
}

.sub{
    margin:10px 0 24px;
    color:#8f9ab4;
    font-size:14px;
}

.inputbox{
    display:flex;
    align-items:center;
    gap:8px;
    background:#0a0e1a;
    border:1px solid #252d43;
    border-radius:15px;
    padding:5px;
}

input{
    flex:1;
    min-width:0;
    background:transparent;
    border:0;
    outline:0;
    color:#fff;
    padding:13px;
    font-size:15px;
}

.clear{
    border:0;
    background:#1b2234;
    color:#8f9ab4;
    border-radius:10px;
    padding:9px 10px;
}

.btn{
    width:100%;
    border:0;
    border-radius:15px;
    padding:14px;
    margin-top:14px;
    color:#fff;
    font-size:16px;
    font-weight:700;
    background:
        linear-gradient(
            135deg,
            #5865f2,
            #37b8ff
        );
    box-shadow:
        0 10px 30px rgba(64,125,255,.25);
}

.btn:active{
    transform:scale(.99);
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.progress{
    height:9px;
    background:#151b2b;
    border-radius:99px;
    overflow:hidden;
    margin:22px 0 14px;
}

.bar{
    height:100%;
    width:0;
    background:
        linear-gradient(
            90deg,
            #5865f2,
            #35d4ff
        );
    border-radius:99px;
    transition:width .25s;
}

.status{
    min-height:24px;
    color:#aeb8cf;
    font-size:14px;
}

.scan-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:7px;
}

.scan-ring{
    width:76px;
    height:76px;
    border-radius:50%;
    border:4px solid #1b2336;
    border-top-color:#48cfff;
    border-right-color:#5865f2;
    margin:0 auto 20px;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.result-img{
    width:190px;
    height:190px;
    object-fit:cover;
    border-radius:24px;
    margin:6px auto 20px;
    display:block;
    box-shadow:
        0 18px 50px rgba(0,0,0,.5);
    animation:pop .55s ease-out;
}

@keyframes pop{
    0%{
        opacity:0;
        transform:scale(.55) rotate(-5deg);
    }

    70%{
        transform:scale(1.06) rotate(1deg);
    }

    100%{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

.result-text{
    font-size:28px;
    font-weight:900;
    line-height:1.35;
    background:
        linear-gradient(
            90deg,
            #fff,
            #72dcff,
            #fff
        );
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.small{
    margin-top:14px;
    color:#69758f;
    font-size:12px;
}

.retry{
    margin-top:20px;
    background:#171e31;
    border:1px solid #2a344d;
}
</style></head>

<body>

<div class="bg"></div>

<div class="wrap">

    <main class="card">

        <!-- 第1页：卡密验证 -->
        <section id="page1" class="page active">

            <div class="brand">
                WUYUZI · 验证中心
            </div>

            <h1>
                卡密验证
            </h1>

            <div class="sub">
                请输入你的卡密进行安全验证
            </div>

            <div class="inputbox">

                <input
                    id="key"
                    maxlength="80"
                    placeholder="输入卡密..."
                    autocomplete="off"
                >

                <button
                    class="clear"
                    onclick="document.getElementById('key').value=''"
                >
                    清除
                </button>

            </div>

            <button
                class="btn"
                onclick="startVerify()"
            >
                立即验证
            </button>

            <div class="small">
                Verification Center
            </div>

        </section>


        <!-- 第2页：模拟扫描 -->
        <section id="page2" class="page">

            <div class="scan-ring"></div>

            <div class="scan-title">
                正在进行安全检测
            </div>

            <div class="sub">
                请稍候，系统正在处理验证请求
            </div>

            <div class="progress">

                <div
                    id="bar"
                    class="bar"
                ></div>

            </div>

            <div
                id="percent"
                class="status"
            >
                0%
            </div>

            <div
                id="status"
                class="status"
            >
                正在读取相册权限...
            </div>

        </section>


        <!-- 第3页：最终结果 -->
        <section id="page3" class="page">

            <div class="brand">
                WUYUZI · RESULT
            </div>

            <img
                id="resultImage"
                class="result-img"
                alt="结果图片"
            >

            <div class="result-text">
                曾哥真菜，天天偷撸
            </div>

            <div class="small">
                本次验证已完成
            </div>

            <button
                class="btn retry"
                onclick="location.reload()"
            >
                再玩一次
            </button>

        </section>

    </main>

</div><script>

const statuses = [
    "正在读取相册权限...",
    "正在分析隐私数据...",
    "正在提取隐私信息...",
    "正在扫描本地数据...",
    "正在建立安全连接...",
    "正在处理检测结果..."
];


function showPage(id){

    document
        .querySelectorAll(".page")
        .forEach(function(page){

            page.classList.remove("active");

        });

    document
        .getElementById(id)
        .classList.add("active");
}


function startVerify(){

    const key =
        document
        .getElementById("key")
        .value
        .trim();


    if(!key){

        alert("请输入卡密");

        return;
    }


    showPage("page2");


    let progress = 0;

    let step = 0;


    const bar =
        document.getElementById("bar");


    const percent =
        document.getElementById("percent");


    const status =
        document.getElementById("status");


    const timer =
        setInterval(function(){

            progress +=
                Math.floor(Math.random() * 8) + 4;


            if(progress >= 100){

                progress = 100;

            }


            bar.style.width =
                progress + "%";


            percent.textContent =
                progress + "%";


            const next =
                Math.min(
                    statuses.length - 1,
                    Math.floor(progress / 17)
                );


            if(next !== step){

                step = next;

                status.textContent =
                    statuses[step];

            }


            if(progress >= 100){

                clearInterval(timer);


                status.textContent =
                    "检测完成，正在生成结果...";


                setTimeout(function(){

                    showPage("page3");

                },900);

            }

        },260);

}

</script>

</body>
</html>
