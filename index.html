<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#080b16" />
  <title>无雨子 · 卡密验证系统中心</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, rgba(80, 100, 255, 0.18), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(180, 60, 255, 0.15), transparent 35%),
        #080b16;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #8ea2ff, #d18cff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .brand-sub {
      margin-top: 6px;
      font-size: 12px;
      color: #77809b;
      letter-spacing: 3px;
    }

    .card {
      background: rgba(18, 23, 40, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.45),
        inset 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(18px);
    }

    .icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      margin: 0 auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      background: linear-gradient(135deg, #5068ff, #a44cff);
      box-shadow: 0 10px 35px rgba(90, 80, 255, 0.35);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .desc {
      text-align: center;
      color: #7e879e;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      height: 54px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      outline: none;
      background: rgba(255, 255, 255, 0.055);
      color: white;
      padding: 0 48px 0 16px;
      font-size: 15px;
      transition: 0.25s;
    }

    input:focus {
      border-color: #7182ff;
      box-shadow: 0 0 0 3px rgba(113, 130, 255, 0.12);
    }

    input::placeholder {
      color: #59627b;
    }

    .clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #737c96;
      font-size: 18px;
      cursor: pointer;
    }

    .submit {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #566cff, #a04cff);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(93, 76, 255, 0.28);
      transition: 0.2s;
    }

    .submit:active {
      transform: scale(0.98);
    }

    .tip {
      text-align: center;
      color: #59627b;
      font-size: 11px;
      margin-top: 16px;
    }

    /* 扫描页面 */

    .scan-card {
      display: none;
    }

    .scan-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(88, 105, 255, 0.12);
      border: 1px solid rgba(110, 125, 255, 0.25);
      position: relative;
    }

    .scan-icon::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #7081ff;
      animation: rotate 1s linear infinite;
    }

    .scan-icon span {
      font-size: 30px;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    .scan-title {
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .status-box {
      min-height: 58px;
      border-radius: 14px;
      padding: 17px;
      background: rgba(255, 255, 255, 0.045);
      color: #b9c0d4;
      font-size: 13px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6f82ff;
      box-shadow: 0 0 12px #6f82ff;
      flex-shrink: 0;
      animation: blink 0.8s infinite alternate;
    }

    @keyframes blink {
      from {
        opacity: 0.35;
      }
      to {
        opacity: 1;
      }
    }

    .progress-wrap {
      margin-bottom: 8px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      color: #737d98;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .progress {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #5d74ff, #bc61ff);
      transition: width 0.25s ease;
      box-shadow: 0 0 15px rgba(113, 100, 255, 0.7);
    }

    /* 最终页面 */

    .result-card {
      display: none;
      text-align: center;
    }

    .result-icon {
      font-size: 58px;
      margin-bottom: 12px;
      animation: pop 0.6s ease;
    }

    @keyframes pop {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      70% {
        transform: scale(1.15);
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .result-title {
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #7e8fff, #d76dff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .result-sub {
      color: #8c95aa;
      font-size: 13px;
      line-height: 1.8;
    }

    .restart {
      margin-top: 24px;
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.045);
      color: #aeb6cb;
      cursor: pointer;
    }

    @media (max-width: 380px) {
      .card {
        padding: 24px 18px;
      }

      .result-title {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      <div class="brand-name">无雨子</div>
      <div class="brand-sub">WUYUZI · VERIFICATION CENTER</div>
    </div>

    <!-- 第一页：卡密验证 -->
    <div class="card verify-card" id="verifyCard">

      <div class="icon">🔐</div>

      <h1>卡密验证</h1>

      <div class="desc">
        请输入您的卡密完成身份验证
      </div>

      <div class="input-wrap">
        <input
          id="keyInput"
          type="text"
          placeholder="请输入卡密"
          autocomplete="off"
        />

        <button class="clear" id="clearBtn">×</button>
      </div>

      <button class="submit" id="submitBtn">
        立即验证
      </button>

      <div class="tip">
        ● 验证服务运行正常
      </div>

    </div>


    <!-- 第二页：假装扫描 -->
    <div class="card scan-card" id="scanCard">

      <div class="scan-icon">
        <span>🛡️</span>
      </div>

      <div class="scan-title">
        正在进行安全验证
      </div>

      <div class="status-box">
        <div class="status-dot"></div>
        <div id="statusText">
          正在建立安全连接...
        </div>
      </div>

      <div class="progress-wrap">

        <div class="progress-top">
          <span>检测进度</span>
          <span id="progressText">0%</span>
        </div>

        <div class="progress">
          <div class="progress-bar" id="progressBar"></div>
        </div>

      </div>

    </div>


    <!-- 第三页：最终结果 -->
    <div class="card result-card" id="resultCard">

      <div class="result-icon">
        😎
      </div>

      <div class="result-title">
        北101豪哥NB
      </div>

      <div class="result-sub">
        验证完成<br>
        本次检测已结束
      </div>

      <button class="restart" id="restartBtn">
        再玩一次
      </button>

    </div>

  </div>


  <script>

    const verifyCard = document.getElementById("verifyCard");
    const scanCard = document.getElementById("scanCard");
    const resultCard = document.getElementById("resultCard");

    const keyInput = document.getElementById("keyInput");
    const clearBtn = document.getElementById("clearBtn");
    const submitBtn = document.getElementById("submitBtn");

    const statusText = document.getElementById("statusText");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");

    const restartBtn = document.getElementById("restartBtn");


    clearBtn.addEventListener("click", () => {
      keyInput.value = "";
      keyInput.focus();
    });


    submitBtn.addEventListener("click", startVerification);


    keyInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        startVerification();
      }
    });


    function startVerification() {

      const key = keyInput.value.trim();

      if (!key) {
        keyInput.focus();
        keyInput.style.borderColor = "#ff637d";

        setTimeout(() => {
          keyInput.style.borderColor = "";
        }, 700);

        return;
      }

      verifyCard.style.display = "none";
      scanCard.style.display = "block";

      runFakeScan();
    }


    function runFakeScan() {

      const statuses = [
        "正在读取相册权限...",
        "正在分析隐私数据...",
        "正在提取隐私信息...",
        "正在扫描本地数据...",
        "正在建立安全连接...",
        "正在处理检测结果..."
      ];

      let progress = 0;
      let statusIndex = 0;

      statusText.textContent = statuses[0];

      const timer = setInterval(() => {

        progress += Math.floor(Math.random() * 5) + 2;

        if (progress >= 100) {
          progress = 100;
        }

        progressBar.style.width = progress + "%";
        progressText.textContent = progress + "%";


        const nextIndex = Math.min(
          Math.floor(progress / 17),
          statuses.length - 1
        );

        if (nextIndex !== statusIndex) {
          statusIndex = nextIndex;
          statusText.textContent = statuses[statusIndex];
        }


        if (progress >= 100) {

          clearInterval(timer);

          statusText.textContent = "检测完成";

          setTimeout(() => {

            scanCard.style.display = "none";
            resultCard.style.display = "block";

          }, 900);
        }

      }, 260);
    }


    restartBtn.addEventListener("click", () => {

      resultCard.style.display = "none";
      scanCard.style.display = "none";
      verifyCard.style.display = "block";

      keyInput.value = "";

      progressBar.style.width = "0%";
      progressText.textContent = "0%";

      statusText.textContent = "正在建立安全连接...";

    });

  </script>

</body>
</html>
