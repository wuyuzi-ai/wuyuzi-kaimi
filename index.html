<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#080b16">

<title>无雨子 · 卡密验证中心</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft YaHei",
    sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  color:#fff;
  background:#080b16;
  overflow-x:hidden;
  position:relative;
}

/* 背景光晕 */
body::before,
body::after{
  content:"";
  position:fixed;
  border-radius:50%;
  filter:blur(70px);
  opacity:.35;
  pointer-events:none;
}

body::before{
  width:260px;
  height:260px;
  background:#635bff;
  top:-80px;
  left:-80px;
}

body::after{
  width:300px;
  height:300px;
  background:#00b8ff;
  right:-120px;
  bottom:-100px;
}

.wrap{
  width:100%;
  max-width:430px;
  position:relative;
  z-index:1;
}

/* 顶部品牌 */
.top{
  text-align:center;
  margin-bottom:18px;
}

.brand{
  display:inline-flex;
  align-items:center;
  gap:9px;
  font-weight:800;
  font-size:15px;
  letter-spacing:1px;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7c6cff,#00cfff);
  box-shadow:0 8px 25px rgba(74,107,255,.35);
}

.sub{
  margin-top:9px;
  color:#8f98ad;
  font-size:12px;
}

/* 主卡片 */
.card{
  padding:28px 22px 20px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:26px;
  background:
    linear-gradient(
      180deg,
      rgba(24,29,48,.92),
      rgba(13,17,30,.96)
    );
  box-shadow:
    0 25px 80px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

.badge{
  display:inline-flex;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(124,108,255,.12);
  color:#a9a0ff;
  font-size:11px;
  font-weight:700;
}

h1{
  font-size:28px;
  margin:13px 0 7px;
  letter-spacing:-.5px;
}

.desc{
  color:#8f98ad;
  font-size:13px;
  margin-bottom:22px;
}

/* 输入框 */
.field{
  position:relative;
}

.input{
  width:100%;
  height:56px;
  padding:0 46px 0 16px;
  border-radius:15px;
  border:1px solid #2b3247;
  outline:none;
  background:#0a0e1a;
  color:#fff;
  font-size:15px;
  transition:.2s;
}

.input::placeholder{
  color:#596277;
}

.input:focus{
  border-color:#766bff;
  box-shadow:
    0 0 0 4px rgba(118,107,255,.12);
}

/* 清除按钮 */
.clear{
  display:none;
  position:absolute;
  right:12px;
  top:14px;
  width:28px;
  height:28px;
  border:0;
  border-radius:50%;
  background:#222a3c;
  color:#aeb6c8;
  cursor:pointer;
}

/* 验证按钮 */
.btn{
  width:100%;
  height:54px;
  margin-top:13px;
  border:0;
  border-radius:15px;
  color:#fff;
  font-size:15px;
  font-weight:800;
  background:
    linear-gradient(
      135deg,
      #766bff,
      #18bfff
    );
  box-shadow:
    0 12px 28px rgba(83,106,255,.25);
  cursor:pointer;
  transition:.2s;
}

.btn:active{
  transform:scale(.985);
}

.btn:disabled{
  opacity:.65;
  cursor:default;
}

/* 进度 */
.progress-box{
  display:none;
  margin-top:20px;
}

.progress-line{
  display:flex;
  justify-content:space-between;
  color:#9ca6bb;
  font-size:12px;
  margin-bottom:9px;
}

.progress{
  height:7px;
  background:#20273a;
  border-radius:99px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0;
  background:
    linear-gradient(
      90deg,
      #766bff,
      #18bfff
    );
  border-radius:99px;
  transition:width .18s;
}

/* 结果 */
.result{
  display:none;
  margin-top:20px;
  padding:22px 14px;
  text-align:center;
  border-radius:18px;
  background:rgba(255,196,72,.07);
  border:1px solid rgba(255,196,72,.2);
}

.result-icon{
  font-size:45px;
  animation:bounce .8s ease;
}

.result-title{
  margin-top:8px;
  font-size:22px;
  font-weight:900;
  color:#ffd36a;
}

.result-text{
  margin-top:7px;
  color:#aeb6c8;
  font-size:13px;
}

/* 提示 */
.tip{
  display:flex;
  gap:8px;
  margin-top:16px;
  padding:11px 12px;
  border-radius:12px;
  background:#101526;
  color:#69748a;
  font-size:11px;
  line-height:1.6;
}

.dot{
  color:#18bfff;
}

/* 底部 */
.footer{
  margin-top:18px;
  text-align:center;
  color:#586176;
  font-size:11px;
}

/* 动画 */
@keyframes bounce{
  0%{
    transform:scale(.6);
    opacity:.2;
  }

  70%{
    transform:scale(1.12);
  }

  100%{
    transform:scale(1);
    opacity:1;
  }
}

/* 手机小屏 */
@media(max-width:360px){

  .card{
    padding:24px 16px 18px;
  }

  h1{
    font-size:25px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <!-- 顶部 -->
  <div class="top">

    <div class="brand">

      <div class="brand-mark">
        雨
      </div>

      <span>
        无雨子
      </span>

    </div>

    <div class="sub">
      WUYUZI · 验证中心
    </div>

  </div>


  <!-- 主卡片 -->
  <div class="card">

    <span class="badge">
      安全验证
    </span>

    <h1>
      卡密验证
    </h1>

    <div class="desc">
      请输入卡密，验证你的授权状态
    </div>


    <!-- 输入框 -->
    <div class="field">

      <input
        id="key"
        class="input"
        type="text"
        placeholder="请输入你的卡密"
        autocomplete="off"
      >

      <button
        id="clear"
        class="clear"
        type="button"
      >
        ×
      </button>

    </div>


    <!-- 验证按钮 -->
    <button
      id="btn"
      class="btn"
      type="button"
    >
      立即验证
    </button>


    <!-- 验证进度 -->
    <div
      id="progressBox"
      class="progress-box"
    >

      <div class="progress-line">

        <span id="progressText">
          准备验证...
        </span>

        <span id="percent">
          0%
        </span>

      </div>

      <div class="progress">

        <div
          id="bar"
          class="bar"
        ></div>

      </div>

    </div>


    <!-- 最终结果 -->
    <div
      id="result"
      class="result"
    >

      <div class="result-icon">
        😂
      </div>

      <div class="result-title">
        恭喜你！
      </div>

      <div class="result-text">
        成功被骗了！
      </div>

    </div>


    <!-- 娱乐提示 -->
    <div class="tip">

      <span class="dot">
        ●
      </span>

      <span>
        本页面仅用于娱乐演示，不会读取或保存你的真实账号信息。
      </span>

    </div>

  </div>


  <div class="footer">
    无雨子 · 卡密验证系统
  </div>

</div>


<script>

const key =
  document.getElementById("key");

const btn =
  document.getElementById("btn");

const clear =
  document.getElementById("clear");

const box =
  document.getElementById("progressBox");

const text =
  document.getElementById("progressText");

const percent =
  document.getElementById("percent");

const bar =
  document.getElementById("bar");

const result =
  document.getElementById("result");


/* 输入时显示清除按钮 */

key.addEventListener(
  "input",
  function(){

    clear.style.display =
      key.value
      ? "block"
      : "none";

  }
);


/* 清除卡密 */

clear.addEventListener(
  "click",
  function(){

    key.value = "";

    clear.style.display =
      "none";

    key.focus();

  }
);


/* 验证 */

function verifyKey(){

  if(!key.value.trim()){

    key.focus();

    return;

  }


  btn.disabled = true;

  box.style.display =
    "block";

  result.style.display =
    "none";

  bar.style.width =
    "0%";

  percent.textContent =
    "0%";


  let p = 0;


  const timer =
    setInterval(
      function(){

        p += 10;

        bar.style.width =
          p + "%";

        percent.textContent =
          p + "%";


        if(p < 40){

          text.textContent =
            "正在连接验证服务器...";

        }

        else if(p < 70){

          text.textContent =
            "正在校验卡密信息...";

        }

        else if(p < 100){

          text.textContent =
            "正在读取验证结果...";

        }

        else{

          clearInterval(timer);

          text.textContent =
            "验证完成";


          setTimeout(
            function(){

              box.style.display =
                "none";

              result.style.display =
                "block";

              btn.disabled =
                false;

            },
            450
          );

        }

      },
      180
    );

}


/* 点击验证 */

btn.addEventListener(
  "click",
  verifyKey
);


/* 回车验证 */

key.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      verifyKey();

    }

  }
);

</script>

</body>
</html>
